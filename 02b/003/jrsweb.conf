server {
    listen 8989;               # 监听80端口（HTTP）
    server_name www.jrs-lab.com;           # 匹配所有域名。如有域名，请替换为您的域名，如 www.example.com

    # 网站根目录
    #root  /web/jrslab;
    #改为/web，这样可以任意在其下建子目录
    root  /web;

    # 默认索引文件（当访问目录时，Nginx会尝试按顺序查找这些文件）
    index index.html index.htm;

# 处理根路径请求
    location / {
        # 1. 开启目录浏览功能
        autoindex on;

        # 2. (可选) 以 KB/MB/GB 为单位显示文件大小，而不是字节
        autoindex_exact_size off;

        # 3. (可选) 显示服务器本地时间，而不是 UTC 时间
        autoindex_localtime on;

        # 4. (可选) 设置字符集，防止中文文件名乱码
        charset utf-8,gbk;

        # 5. 尝试按请求的URI寻找文件，如果找不到且不是目录，则返回404
        # 如果找到的是目录且没有 index 文件，autoindex 会生效并列出目录内容
        try_files $uri $uri/ =404;
    }
}